function vKeys(){const ids=[...Object.keys(PRESETS),'custom'];return `<div class="card"><h2>Notenschlüssel</h2>
 <p class="muted">In Bayern legt die Lehrkraft den Notenschlüssel fest. Am genauesten wird's, wenn du den Schlüssel aus einer echten Probe deines Kindes unten übernimmst.</p>
 <label class="f">Standard für neue Proben</label><select style="max-width:320px" onchange="S.keyId=this.value;SET.keyId=this.value;save();render()">${ids.map(id=>`<option value="${id}"${S.keyId===id?' selected':''}>${keyName(id)}</option>`).join('')}</select>
 <h3>Übersicht (ab … % der Punkte)</h3><div style="overflow-x:auto"><table><tr><th>Schlüssel</th>${[1,2,3,4,5].map(n=>`<th>Note ${n}</th>`).join('')}<th>Note 6</th></tr>${ids.map(id=>{const g=keyG(id);return `<tr${S.keyId===id?' class="hl"':''}><td>${keyName(id)}</td>${g.map(x=>`<td>${fmtNum(x)} %</td>`).join('')}<td>&lt; ${fmtNum(g[4])} %</td></tr>`}).join('')}</table></div></div>
 <div class="card"><h2>Eigener Schlüssel</h2><h3>In Prozent</h3><div class="grid">${S.custom.map((x,i)=>`<div><label class="f">Note ${i+1} ab %</label><input type="number" step="0.5" value="${x}" id="ck${i}"></div>`).join('')}</div>
 <p><button class="btn" onclick="saveCustomPct()">Speichern</button></p>
 <h3>Aus echter Probe übernehmen</h3><p class="muted" style="margin-top:-4px">Gesamtpunktzahl und Mindestpunkte je Note vom Probenblatt eintragen – wird automatisch in Prozent umgerechnet.</p>
 <div class="grid"><div><label class="f">Gesamtpunkte</label><input type="number" step="0.5" id="cpMax" placeholder="z. B. 40"></div>${[1,2,3,4,5].map(n=>`<div><label class="f">Note ${n} ab Punkte</label><input type="number" step="0.5" id="cp${n}"></div>`).join('')}</div>
 <p><button class="btn" onclick="saveCustomPts()">Übernehmen</button></p></div>
 <div class="card"><h2>Punktetabelle</h2><div class="row"><label>Gesamtpunkte <input type="number" id="tblMax" value="40" style="width:100px" oninput="$('#tblOut').innerHTML=keyTable(+this.value||1,keyG(S.keyId))"></label><span class="muted">(${keyName(S.keyId)})</span></div><div id="tblOut" style="overflow-x:auto">${keyTable(40,keyG(S.keyId))}</div></div>`}
function validKey(g){for(let i=0;i<5;i++){if(isNaN(g[i])||g[i]<=0||g[i]>100)return false;if(i&&g[i]>=g[i-1])return false}return true}
function saveCustomPct(){const g=[0,1,2,3,4].map(i=>parseNum($('#ck'+i).value));if(!validKey(g)){note('Werte müssen zwischen 0 und 100 liegen und von Note 1 bis 5 absteigen.');return}S.custom=g;S.keyId='custom';SET.keyId='custom';save();render()}
function saveCustomPts(){const mx=parseNum($('#cpMax').value),g=[1,2,3,4,5].map(n=>Math.round(parseNum($('#cp'+n).value)/mx*1000)/10);if(!(mx>0)||!validKey(g)){note('Bitte Gesamtpunkte und absteigende Mindestpunkte für Note 1–5 eintragen.');return}S.custom=g;S.keyId='custom';SET.keyId='custom';save();note('Eigener Schlüssel gespeichert: '+g.map((x,i)=>`Note ${i+1} ab ${fmtNum(x)} %`).join(', '));render()}

function vSettings(){return uiCard()+`<div class="card"><h2>🔊 Vorlesen testen</h2><p class="muted">Prüft, ob das Gerät vorlesen kann und welche Stimmen installiert sind.</p><button class="btn" onclick="ttsTest()">▶ Test starten</button><div id="ttsOut" style="margin-top:10px"></div></div>`+`<div class="card"><h2>👤 Kinder</h2>

function kidSet(id,k,v){const x=S.kids.find(k_=>k_.id===id);x[k]=k==='name'?(v.trim()||x.name):v;if(k==='sa'){x.sa=v;const kls=klassenOf(v);if(!kls.includes(x.kl))x.kl=kls[0]}save();if(id===(kid()||{}).id&&(k==='sa'||k==='kl'))initSet();render()}
async function delKid(id){const k=S.kids.find(x=>x.id===id);if(!await ask(`${k.name} und alle zugehörigen Ergebnisse löschen?`))return;S.kids=S.kids.filter(x=>x.id!==id);S.attempts=S.attempts.filter(a=>a.kidId!==id);S.termine=(S.termine||[]).filter(t=>t.kidId!==id);S.grades=(S.grades||[]).filter(g=>g.kidId!==id);S.redeemed=(S.redeemed||[]).filter(r=>r.kidId!==id);if(S.box)delete S.box[id];if(S.mastered)delete S.mastered[id];if(S.spent)delete S.spent[id];S.blitz=(S.blitz||[]).filter(b=>b.kidId!==id);if(S.schreib)delete S.schreib[id];if(S.kidId===id)S.kidId=S.kids[0]?S.kids[0].id:null;save();initSet();render()}
async function wipe(){if(!await ask('Wirklich ALLE Daten (Kinder, Ergebnisse, eigene Proben) löschen?'))return;S=defaults();save();initSet();go('ueben')}
function download(name,obj){const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function importFile(mode){FILEMODE=mode;const f=$('#fileIn');f.value='';f.click()}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);
 if(FILEMODE==='backup'){if(d.typ!=='probentrainer-backup'||!d.data)throw new Error('Keine Probentrainer-Sicherung.');if(await dlg('Wie soll die Sicherung geladen werden?\n\nZusammenführen: Daten beider Geräte vereinen (empfohlen).\nErsetzen: aktuelle Daten verwerfen.','Zusammenführen','Ersetzen')){const n=mergeData(d.data);save();initSet();note(`Zusammengeführt: ${n.attempts} neue Ergebnisse, ${n.kids} neue Kinder${n.merged?`, ${n.merged} Kind(er) mit gleichem Namen vereint`:''}.`);render()}else{if(!await ask('Wirklich alle aktuellen Daten durch die Sicherung ersetzen?'))return;S=Object.assign(defaults(),d.data);save();initSet();note('Sicherung geladen.');render()}}
 else{const ps=Array.isArray(d)?d:d.probes;if(!Array.isArray(ps))throw new Error('Keine Proben in der Datei.');let n=0;ps.forEach(p=>{if(p&&p.titel&&Array.isArray(p.qs)){p.id=uid();S.probes.push(p);n++}});save();note(n+' Probe(n) importiert.');render()}
 }catch(err){note('Import fehlgeschlagen: '+err.message)}};r.readAsText(f)});

/* ================= Start ================= */
load();seedBox();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(UI().theme==='auto')render()})}catch(e){}if(!S.kidId&&S.kids[0])S.kidId=S.kids[0].id;initSet();render();
window.addEventListener('beforeunload',e=>{if(RUN&&VIEW==='run'){e.preventDefault();e.returnValue=''}});
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller&&typeof note==='function')note('Eine neue Version des Probentrainers ist da – App einmal schließen und neu öffnen.')})})}).catch(()=>{}));</script>
</body>
</html>

<title>Probentrainer – Proben & Schulaufgaben üben</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--card2:#f7f8fc;--ink:#151a2d;--muted:#667089;--line:#e3e7f0;--acc:#4f46e5;--acc2:#7c3aed;--accbg:#eef0ff;--ok:#15803d;--okbg:#e7f7ee;--bad:#d1263b;--badbg:#fdebee;--warn:#b45309;--warnbg:#fff5e0;--hl:#fff7d6;--side:#ffffff;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);--r:18px}
[data-accent=blue]{--acc:#2563eb;--acc2:#0ea5e9;--accbg:#e8f0ff}
[data-accent=green]{--acc:#059669;--acc2:#14b8a6;--accbg:#e4f7f0}
[data-accent=orange]{--acc:#ea580c;--acc2:#f59e0b;--accbg:#fff0e4}
[data-accent=pink]{--acc:#db2777;--acc2:#a855f7;--accbg:#fde8f3}
[data-theme=dark]{--bg:#0d1020;--card:#171b2e;--card2:#1e2338;--ink:#e9ecf6;--muted:#9aa3bd;--line:#2a3048;--accbg:#232a4d;--okbg:#12301f;--badbg:#3b1720;--warnbg:#3a2a12;--hl:#3a3415;--side:#121628;--shadow:0 1px 0 rgba(255,255,255,.03)}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
/* ---------- App-Rahmen ---------- */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.brand b{font-size:17px;display:block}.brand small{color:var(--muted);font-size:12px}
.navsec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
.navi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}
.navi:hover{background:var(--card2)}.navi.on{background:var(--accbg);color:var(--acc)}
.ni{width:26px;text-align:center;font-size:18px}
.nbadge{margin-left:auto;background:var(--acc);color:#fff;border-radius:999px;font-size:11px;padding:2px 8px;font-weight:700}
.navi.lock{opacity:.6}
.sidefoot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted)}
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 22px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ptitle{font-size:20px;font-weight:800;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kidsel{width:auto;max-width:200px;border-radius:999px;padding:8px 14px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover,.chipbtn:hover{border-color:var(--acc)}
.mob{display:none}
main{width:100%;max-width:1040px;margin:0 auto;padding:22px}
.bnav{display:none}
.drawer{position:fixed;inset:0;z-index:60;pointer-events:none}
.drawer .ov{position:absolute;inset:0;background:rgba(10,14,30,.45);opacity:0;transition:opacity .2s}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(320px,88vw);background:var(--side);padding:18px 14px;transform:translateX(100%);transition:transform .25s;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.drawer.open{pointer-events:auto}.drawer.open .ov{opacity:1}.drawer.open .panel{transform:none}
/* ---------- Bausteine ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:20px;margin:0 0 12px;letter-spacing:-.01em} h3{font-size:16px;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);transition:all .15s}
.chip:hover{border-color:var(--c,var(--acc))}
.chip.on{border-color:var(--c,var(--acc));background:var(--c,var(--acc));color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.chip.sm{padding:6px 12px;font-size:14px;font-weight:500}
.btn{border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.22);transition:transform .1s,filter .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.bad{background:var(--bad)}.btn.ok{background:linear-gradient(135deg,#16a34a,#059669)}
.btn.light{background:#fff;color:var(--acc);box-shadow:0 6px 20px rgba(0,0,0,.15)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);width:100%;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
textarea{min-height:64px;resize:vertical} input[type=checkbox]{width:auto}
.muted{color:var(--muted);font-size:.88em}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--acc)}
.swatches{display:flex;gap:10px}.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw.on{box-shadow:0 0 0 3px var(--ink)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;border:0;padding:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--acc)}.switch input:checked::after{left:23px}
/* ---------- Startseite ---------- */
.hero{border-radius:22px;padding:24px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(79,70,229,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-t{font-size:26px;font-weight:800;letter-spacing:-.02em}.hero-s{opacity:.9;margin-top:2px}.hero>div{flex:1;min-width:200px;position:relative;z-index:1}.hero .btn{position:relative;z-index:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--acc)}
.tile .ti{font-size:22px}.tile .tv{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.02em}.tile .tl{color:var(--muted);font-size:13px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qa button{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:16px;padding:16px 12px;font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;transition:all .15s}
.qa button:hover{border-color:var(--acc);background:var(--accbg)}
.qa .qi{font-size:24px}.qa small{font-weight:500;color:var(--muted);font-size:12px}
/* ---------- Durchführung ---------- */
.qcard .q{font-size:22px;font-weight:700;margin:6px 0 18px;letter-spacing:-.01em}
.ansrow{display:flex;align-items:center;gap:10px}
input.big{font-size:22px;padding:14px;max-width:360px;border-width:2px}
.unit{font-size:20px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);font:inherit;font-size:18px;cursor:pointer;color:var(--ink);transition:all .12s}
.opt:hover{border-color:var(--acc)}.opt.on{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.progress{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin:12px 0 4px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:999px;transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.dot{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.dot.ans{background:var(--accbg);border-color:var(--acc)}.dot.cur{outline:3px solid #f59e0b;outline-offset:1px}
.dot.r{background:var(--okbg);border-color:var(--ok)}.dot.w{background:var(--badbg);border-color:var(--bad)}
.actions{position:sticky;bottom:0;background:var(--card);padding:12px 0 2px;margin-top:18px;border-top:1px solid var(--line)}
.fb{padding:12px 14px;border-radius:12px;margin-top:14px}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
#tmr{font-weight:800;font-variant-numeric:tabular-nums;background:var(--card2);padding:6px 10px;border-radius:10px}#tmr.low{color:var(--bad)}
.note{width:120px;height:120px;border-radius:32px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:60px;font-weight:800;flex:none;box-shadow:0 10px 26px rgba(0,0,0,.15)}
.big2{font-size:26px;font-weight:800;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
tr.hl td{background:var(--hl);font-weight:700}
.ri{border-left:5px solid var(--line);padding:12px 14px;margin:8px 0;background:var(--card2);border-radius:12px}
.ri.ok{border-color:var(--ok)}.ri.bad{border-color:var(--bad)}.ri.pend{border-color:var(--warn);background:var(--warnbg)}
.bar{height:10px;background:var(--card2);border-radius:999px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;border-radius:999px}
.chart{width:100%;height:auto}
.eq{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:var(--card2)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;margin-top:10px;overflow-x:auto}
.heat i{border-radius:3px;display:block}
.goalbar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:10px;max-width:280px;overflow:hidden}.goalbar i{display:block;height:100%;background:#fff;border-radius:99px}
@media(max-width:700px){.pastx{max-height:42vh;overflow-y:auto}}
.mauer{display:inline-flex;flex-direction:column;align-items:center;margin:8px 0;vertical-align:middle}.mauer div{display:flex}.mauer span{border:2px solid var(--ink);min-width:54px;padding:6px 4px;text-align:center;margin:-1px;background:var(--card);font-weight:700}
.coin{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fde68a,#d4a017);border:2px solid #a16207;font-weight:800;font-size:14px;color:#422006;margin:2px}.coin.note5{width:72px;height:42px;border-radius:6px;background:linear-gradient(135deg,#bae6fd,#a7f3d0);border-color:#0e7490}
.srechn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3em;line-height:1.35;margin:8px 0;background:var(--card2);display:inline-block;padding:8px 14px;border-radius:8px}
.hear{background:var(--card2);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:12px}.hear .row{gap:8px}
.hint{background:var(--accbg);border-radius:12px;padding:12px 14px;font-size:14px}
.lese{background:var(--card2);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:17px;font-weight:400;line-height:1.6}
.code{display:block;font-family:ui-monospace,Consolas,monospace;background:var(--card2);border-radius:10px;padding:12px 14px;margin:8px 0;white-space:pre;font-size:15px;font-weight:400;overflow-x:auto}
.klima{overflow-x:auto;margin:8px 0}.klima table{font-size:12px;font-weight:400;width:auto}.klima td,.klima th{padding:3px 4px;text-align:center;text-transform:none}
.gfx{display:block;margin:10px 0;max-width:100%;height:auto;background:#fff;border-radius:14px;padding:6px}
.mrow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}.mrow span{min-width:130px;font-size:18px;font-weight:600}.mrow select{width:auto;font-size:17px;max-width:100%}
.ordl{font-size:18px;margin:6px 0 10px;padding-left:26px}.ordl li{margin:4px 0;font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.badge{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;opacity:.4;filter:grayscale(1)}.badge.on{opacity:1;filter:none;background:var(--hl);border-color:#f59e0b}.bi{font-size:30px}
.starline{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--hl);border:1px solid #f59e0b;font-weight:700}
.dlg{position:fixed;inset:0;background:rgba(10,14,30,.5);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;backdrop-filter:blur(3px)}
.dlgbox{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlgmsg{font-size:17px}
/* ---------- Mobil ---------- */
@media(max-width:899px){
 .side{display:none}.mob{display:inline-flex}
 .topbar{padding:10px 12px;gap:8px}.ptitle{font-size:17px}.hide-m{display:none!important}
 main{padding:12px 12px 92px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
 .bnav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;cursor:pointer}
 .bnav button span{font-size:21px}.bnav button.on{color:var(--acc);background:var(--accbg)}
 body.running .bnav{display:none} body.running main{padding-bottom:16px}
 .qcard .q{font-size:19px}.note{width:90px;height:90px;font-size:44px;border-radius:24px}.hero-t{font-size:22px}.card{padding:16px}
}
#print{display:none}
@media print{
 @page{margin:15mm}
 body{background:#fff;font-size:12pt;color:#000}
 .app,.bnav,.drawer,.dlg{display:none!important}
 #print{display:block}
 .pbreak{page-break-before:always}
 .gfx{border:0}
}
.phead{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
.pq{padding-left:22px} .pq li{margin-bottom:16px;page-break-inside:avoid}
.pqh{display:flex;justify-content:space-between;gap:12px}
.pbox{white-space:nowrap;border:1px solid #000;padding:1px 6px;font-size:10pt;height:fit-content}
.pline{border-bottom:1px solid #000;height:26px;width:70%;margin-top:4px}
.popt{margin:3px 0 0 4px}
.pfoot{margin-top:20px;border-top:2px solid #000;padding-top:10px}
.keyt{border-collapse:collapse;margin-top:12px;width:auto}
.keyt td,.keyt th{border:1px solid currentColor;padding:3px 10px;text-align:center;font-size:11pt;text-transform:none;letter-spacing:0}

.sb0{color:#1d4ed8}.sb1{color:#dc2626}[data-theme=dark] .sb0{color:#93c5fd}[data-theme=dark] .sb1{color:#fca5a5}
.bzq{font-size:54px;font-weight:800;text-align:center;margin:26px 0 16px;font-variant-numeric:tabular-nums;transition:color .2s}.bzq.ok{color:var(--good,#16a34a)}.bzq.no{color:var(--bad,#dc2626);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bzpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:16px auto}.bzpad .btn{font-size:22px;padding:14px 0;justify-content:center}
.tmr{font-weight:800;font-variant-numeric:tabular-nums;background:var(--card2);padding:6px 10px;border-radius:10px}.tmr.low{color:var(--bad)}
.szgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:12px}.szgrid button{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;font:inherit;font-size:22px;font-weight:700;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}.szgrid button small{font-size:9px;line-height:1}.szgrid button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.szc{width:min(320px,86vw);height:auto;aspect-ratio:1;border:2px solid var(--line);border-radius:16px;background:#fff;touch-action:none;cursor:crosshair}
</style>

<body>
<div class="app">
 <aside class="side" id="side"></aside>
 <div class="maincol"><header class="topbar" id="top"></header><main id="main"></main></div>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="drawer" id="drawer"></div>
<div id="print"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

th('Mathe',[6,7],'Dezimalzahlen',()=>pick([
 ()=>{const a=R(105,999),b=R(15,999);return N(`${dec(a,2)} + ${dec(b,2)} = ?`,(a+b)/100,2)},
 ()=>{const a=R(500,999),b=R(15,a-50);return N(`${dec(a,2)} − ${dec(b,2)} = ?`,(a-b)/100,2)},

function poly(cs){const d=cs.length-1;let s='';cs.forEach((c,i)=>{if(!c)return;const e=d-i,a=Math.abs(c),b=(e>0&&a===1?'':a)+(e===0?'':e===1?'x':'x²');s+=s?(c<0?' − ':' + ')+b:(c<0?'−':'')+b});return s||'0'}
function lin2(a,b){const f=(c,v)=>(Math.abs(c)===1?'':Math.abs(c))+v;return(a<0?'−':'')+f(a,'x')+(b<0?' − ':' + ')+f(b,'y')}
const nz=()=>{let n;do{n=R(-6,6)}while(!n);return n};
const sgn=n=>n<0?`− ${-n}`:`+ ${n}`;
const neg=n=>n<0?'−'+(-n):String(n);
const par=n=>n<0?`(−${-n})`:String(n);
const pm=()=>pick([1,-1]);

 ()=>{let a,c;do{a=R(2,9);c=R(1,9)}while(a===c);const b=R(1,9)*pm(),d=R(1,9)*pm();return{t:'term',qh:`Fasse zusammen: ${a}x² ${sgn(b)}x − ${c}x² ${sgn(d)}x`+M('(x² als x^2 oder x² schreiben)'),a:poly([a-c,b+d,0]),short:1,p:2}},
 ()=>{const a=R(2,6),b=R(2,6);return{t:'term',qh:`Vereinfache: ${a}x · ${b}x`,a:poly([a*b,0,0]),short:1,p:1}}
])());

const fact=n=>n<=1?1:n*fact(n-1);
function toRoman(n){const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m)while(n>=v){s+=r;n-=v}return s}

/* ---------- Rechenwege in Schritten (Typ "steps") ---------- */
const STP=(qh,steps,sol='')=>({t:'steps',qh,steps,a:steps.map(s=>s[1]),p:steps.length,sol});
th('Mathe',[4],'Halbschriftlich in Schritten',()=>{const a=R(12,98),b=R(3,9),z=Math.floor(a/10)*10,e=a%10||1,A=z+e;return STP(`Rechne ${A} · ${b} in Schritten.`,[[`${z} · ${b} =`,z*b],[`${e} · ${b} =`,e*b],[`${A} · ${b} =`,A*b]],'Zehner und Einer getrennt multiplizieren, dann addieren')});
th('Mathe',[6,7],'Dreisatz in Schritten',()=>{const a=R(2,6),c=R(12,60)*5;let b;do{b=R(2,9)}while(b===a);return STP(`${a} kg Äpfel kosten ${euro(a*c)}. Was kosten ${b} kg?`,[['1 kg kostet (€)',c/100],[`${b} kg kosten (€)`,b*c/100]],'Erst auf 1 kg schließen, dann auf die gesuchte Menge')});
th('Mathe',[6,7],'Brüche addieren in Schritten',()=>{const D=[2,3,4,5,6,8,10],d1=pick(D),d2=pick(D.filter(x=>x!==d1)),n1=R(1,d1-1),n2=R(1,d2-1),L=d1*d2/gcd(d1,d2),Z=n1*L/d1+n2*L/d2,g=gcd(Z,L);
 return STP(`Berechne ${n1}/${d1} + ${n2}/${d2} in Schritten.`,[['Hauptnenner',L],['Zähler nach dem Erweitern (Summe)',Z],['gekürzter Zähler',Z/g],['gekürzter Nenner',L/g]],`Erweitern auf ${L}: ${n1*L/d1}/${L} + ${n2*L/d2}/${L}`)});
th('Mathe',[7,8],'Prozentrechnung in Schritten',()=>{const G=R(2,40)*50,p=pick([3,5,12,15,20,35,40,60]);return STP(`Wie viel sind ${p} % von ${fmt(G)} €?`,[['1 % von G (€)',G/100],[`${p} % von G (€)`,G*p/100]],'Erst 1 % berechnen (durch 100), dann mal p')});
th('Mathe',[7,8],'Gleichungen in Schritten',()=>{const x=R(-9,9);let a,c;do{a=R(2,9);c=R(1,9)}while(a===c);const b=R(1,15)*pm(),d=a*x+b-c*x;
 return STP(`Löse ${a}x ${sgn(b)} = ${c}x ${sgn(d)} in Schritten.`,[[`Zahl vor x nach „− ${c}x“ auf beiden Seiten`,a-c],[`rechte Seite nach „${b<0?'+ '+(-b):'− '+b}“`,d-b],['x =',x]],'x-Terme auf eine Seite, Zahlen auf die andere, dann teilen')});
th('Mathe',[8,9],'Pythagoras in Schritten',()=>{const[a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20]]);return STP(`Katheten a = ${a} cm, b = ${b} cm. Berechne die Hypotenuse c in Schritten.`,[['a² =',a*a],['b² =',b*b],['c² = a² + b² =',c*c],['c (cm) =',c]],'c² = a² + b², dann Wurzel ziehen')});
th('Mathe',[8,9],'Zinsen in Schritten',()=>{const K=R(10,100)*100,p=pick([2,3,4,6]),m=pick([3,4,6,9]);return STP(`${fmt(K)} € werden ${m} Monate zu ${p} % angelegt.`,[['Jahreszinsen (€)',K*p/100],['Zinsen für 1 Monat (€, auf Cent)',Math.round(K*p/12)/100],[`Zinsen für ${m} Monate (€, auf Cent)`,Math.round(K*p*m/12)/100,m*0.005+0.011]],'Jahreszinsen : 12 · Monate')});
function stepOk(it,given){const g=String(given||'').split(SEP);return it.steps.map((s,i)=>{const x=parseNum(g[i]);return !isNaN(x)&&Math.abs(x-s[1])<=(s[2]??it.tol??0.011)})}
function setStep(k,v){const it=RUN.items[RUN.idx],s=String(RUN.ans[RUN.idx]||'').split(SEP);while(s.length<it.steps.length)s.push('');s[k]=v;RUN.ans[RUN.idx]=s.every(x=>!x.trim())?'':s.join(SEP);const d=document.querySelector(`.dot[data-i="${RUN.idx}"]`);if(d)d.classList.toggle('ans',RUN.ans[RUN.idx]!=='')}
function stepsInput(it,v,locked,dis){const g=String(v||'').split(SEP),ok=locked?stepOk(it,v):[];
 return `<div class="muted">Fülle jeden Schritt aus – Teilpunkte gibt es für jeden richtigen Schritt.</div>`+it.steps.map((s,k)=>`<div class="mrow"><span>${k+1}. ${esc(s[0])}</span><input class="big" style="max-width:180px;font-size:19px;padding:10px" inputmode="decimal" autocomplete="off" value="${esc(g[k]||'')}" oninput="setStep(${k},this.value)" ${dis}>${locked?(ok[k]?' ✅':` ❌ <b>${fmtNum(s[1])}</b>`):''}</div>`).join('')}

/* ---------- Gestufte Hilfen ---------- */
const HELPF=[1,.75,.5,0];
function hintText(it,l){const a=it.a;
 if(l===1){switch(it.t){
  case'mc':{const n=((RUN&&RUN.elim&&RUN.elim[RUN.idx])||[]).length;return n?`${n===1?'Eine falsche Antwort wurde':(n===2?'Zwei':n)+' falsche Antworten wurden'} entfernt.`:'Überlege, welche Antworten sicher nicht passen.'}
  case'tf':return 'Lies die Aussage Wort für Wort – stimmt wirklich jedes Detail?';
  case'num':{const s=String(Math.abs(a));return Number.isInteger(a)?`Die Lösung hat ${s.length} Stelle${s.length>1?'n':''}${a<0?', ist negativ':''} und beginnt mit ${s[0]}.`:`Die Lösung ist eine Kommazahl und beginnt mit ${s[0]}.`}
  case'text':return `Die Lösung hat ${a[0].length} Zeichen und beginnt mit „${a[0][0]}“.`;
  case'frac':return `Der Nenner ist ${a[1]}.`;case'pair':return `Der erste Wert ist ${a[0]}.`;case'term':return `Der Term beginnt mit „${String(a).split(' ')[0]}“.`;
  case'multi':return `Es sind genau ${a.length} Antworten richtig.`;case'order':return `An erster Stelle steht „${a[0]}“.`;case'match':return `„${it.left[0]}“ gehört zu „${a[0]}“.`;
  case'steps':return `Schritt 1 ergibt ${fmtNum(it.steps[0][1])}.`;default:return 'Lies die Aufgabe noch einmal genau.'}}
 if(l===2&&it.pas)return it.pas.m==='h'?'Hörtext: '+esc(it.pas.tx):'Lies den Text noch einmal genau – die Antwort steht darin.';if(l===2)return it.sol?'Lösungsweg: '+esc(it.sol):'Für diese Aufgabe gibt es keinen eigenen Lösungsweg – nimm die nächste Hilfe.';
 return 'Lösung: '+correctDisplay(it)}
function useHint(){const i=RUN.idx,it=RUN.items[i];RUN.help=RUN.help||{};const l=(RUN.help[i]||0)+1;if(l>3)return;RUN.help[i]=l;
 if(l===1&&it.t==='mc'){RUN.elim=RUN.elim||{};RUN.elim[i]=shuffle(it.opts.filter(o=>o!==it.a)).slice(0,Math.max(0,it.opts.length-2))}render()}
function hintBox(it){const l=(RUN.help||{})[RUN.idx]||0;if(!l)return '';let h='';for(let k=1;k<=l;k++)h+=`<div>💡 ${hintText(it,k)}</div>`;return `<div class="hint" style="margin:0 0 14px">${h}<div class="muted" style="margin-top:6px">Mit ${l} Hilfe${l>1?'n':''} gibt es ${l>=3?'keine Punkte':'höchstens '+fmtNum(Math.floor(+it.p*HELPF[l]*2+1e-9)/2)+' von '+fmtNum(+it.p)+(+it.p===1?' Punkt':' Punkten')}.</div></div>`}
function scoreItem(it,given,help){if(it.t==='frei')return null;let base;if(it.t==='steps'){const ok=stepOk(it,given);base=it.p*ok.filter(Boolean).length/ok.length}else base=isCorrect(it,given)?+it.p:0;
 return Math.floor(base*HELPF[Math.min(3,help||0)]*2+1e-9)/2}

function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

 if(Object.keys(map).length){const re=o=>o&&map[o.kidId]?{...o,kidId:map[o.kidId]}:o;d={...d,attempts:(d.attempts||[]).map(re),termine:(d.termine||[]).map(re),grades:(d.grades||[]).map(re),redeemed:(d.redeemed||[]).map(re),box:Object.fromEntries(Object.entries(d.box||{}).map(([k,v])=>[map[k]||k,v])),mastered:Object.fromEntries(Object.entries(d.mastered||{}).map(([k,v])=>[map[k]||k,v]))};n.merged=Object.keys(map).length}

tx('Deutsch',[4,5],'Der verschwundene Schlüssel','Am Montagmorgen suchte Mia überall ihren Haustürschlüssel. Er lag nicht auf dem Schreibtisch und auch nicht in ihrer Jackentasche. Ihr kleiner Bruder Ben grinste nur. Erst als Mia ihn fragte, ob er etwas wisse, holte er den Schlüssel aus seiner Spielzeugkiste. „Ich wollte nur, dass du mit mir spielst“, sagte er leise. Mia lachte und versprach ihm, am Nachmittag mit ihm Fußball zu spielen.',
[['m','Was suchte Mia?','ihren Haustürschlüssel',['ihre Jacke','ihren Schulranzen','ihren Fußball']],['m','Wo war der Schlüssel?','in Bens Spielzeugkiste',['auf dem Schreibtisch','in Mias Jackentasche','im Briefkasten']],['m','Warum hatte Ben den Schlüssel versteckt?','Er wollte, dass Mia mit ihm spielt.',['Er wollte ihn behalten.','Er hatte ihn gefunden und vergessen.','Er wollte Mia ärgern, damit sie zu spät kommt.']],['t','Mia war am Ende wütend auf Ben.',false],['m','Was versprach Mia?','am Nachmittag mit Ben Fußball zu spielen',['Ben ein Eis zu kaufen','den Schlüssel nie mehr zu verlieren','Ben bei den Hausaufgaben zu helfen']]]);
tx('Deutsch',[4,5],'Igel im Garten','Igel sind Säugetiere und gehören zu den Insektenfressern. Am Tag schlafen sie meist versteckt unter Hecken oder Laubhaufen. Erst in der Dämmerung gehen sie auf Nahrungssuche. Sie fressen vor allem Käfer, Regenwürmer und Schnecken. Im Herbst fressen sie sich ein Fettpolster an. Von November bis März halten sie Winterschlaf. Dabei schlägt ihr Herz nur noch wenige Male pro Minute. Milch sollte man Igeln nie geben, denn davon bekommen sie Bauchschmerzen.',
[['m','Wann gehen Igel auf Nahrungssuche?','in der Dämmerung',['am Mittag','nur im Winter','am frühen Morgen um sechs Uhr']],['m','Was fressen Igel vor allem?','Käfer, Regenwürmer und Schnecken',['Äpfel und Birnen','Gras und Blätter','Brot und Milch']],['t','Igel halten von November bis März Winterschlaf.',true],['m','Warum soll man Igeln keine Milch geben?','Sie bekommen davon Bauchschmerzen.',['Sie mögen keine Milch.','Milch ist zu teuer.','Igel trinken nie.']],['m','Um welche Textsorte handelt es sich?','Sachtext',['Märchen','Gedicht','Brief']]]);
tx('Deutsch',[4,5],'Der Ausflug ins Museum','Die Klasse 4b fuhr mit dem Bus ins Naturkundemuseum. Dort stand ein riesiges Dinosaurierskelett. Frau Huber erklärte, dass der Dinosaurier vor etwa 70 Millionen Jahren gelebt hat. Paul wollte unbedingt die Knochen anfassen, aber das war verboten. Danach durften die Kinder in der Werkstatt selbst Fossilien aus Gips gießen. Zum Schluss aßen alle ihre Brotzeit im Museumsgarten. Auf der Rückfahrt schliefen einige Kinder vor Müdigkeit ein.',
[['m','Womit fuhr die Klasse ins Museum?','mit dem Bus',['mit dem Zug','mit dem Fahrrad','zu Fuß']],['m','Wann lebte der Dinosaurier ungefähr?','vor etwa 70 Millionen Jahren',['vor 70 Jahren','vor 7000 Jahren','vor 700 Millionen Jahren']],['t','Paul durfte die Knochen anfassen.',false],['m','Was machten die Kinder in der Werkstatt?','Sie gossen Fossilien aus Gips.',['Sie malten Dinosaurier.','Sie bauten ein Skelett.','Sie backten Kekse.']],['m','Wo aßen die Kinder ihre Brotzeit?','im Museumsgarten',['im Bus','in der Schule','in der Werkstatt']]]);
tx('Deutsch',[4,5],'Ein Brief an Oma','Liebe Oma, vielen Dank für das tolle Buch zu meinem Geburtstag! Ich habe schon die Hälfte gelesen. Die Geschichte von dem Mädchen, das mit seinem Hund durch die Berge wandert, ist sehr spannend. Meine Party war super: Wir waren acht Kinder und haben eine Schatzsuche im Wald gemacht. Leider hat es am Ende geregnet. In den Ferien komme ich dich besuchen. Dann backen wir zusammen deinen Apfelkuchen! Viele Grüße, deine Lea',
[['m','Wer schreibt den Brief?','Lea',['Oma','das Mädchen aus dem Buch','Leas Mama']],['m','Wofür bedankt sich Lea?','für ein Buch',['für einen Hund','für einen Kuchen','für eine Schatzkarte']],['m','Wie viele Kinder waren auf der Party?','acht',['vier','zehn','zwölf']],['t','Bei der Schatzsuche schien bis zum Ende die Sonne.',false],['m','Was wollen Lea und Oma in den Ferien machen?','Apfelkuchen backen',['in die Berge wandern','eine Party feiern','ein Buch schreiben']]]);
tx('Deutsch',[6,7],'Das Smartphone-Experiment','Eine Woche lang verzichtete die Klasse 7a freiwillig auf ihre Smartphones. Am ersten Tag fühlten sich viele unruhig und griffen immer wieder in die leere Hosentasche. Ab dem dritten Tag veränderte sich etwas: In den Pausen spielten die Jugendlichen wieder Tischtennis und unterhielten sich mehr. Am Ende schrieben alle einen kurzen Bericht. Die meisten gaben an, besser geschlafen zu haben. Trotzdem wollte niemand dauerhaft auf das Handy verzichten. Die Klasse beschloss aber, beim Lernen das Handy künftig in einen anderen Raum zu legen.',
[['m','Wie lange dauerte das Experiment?','eine Woche',['einen Tag','einen Monat','drei Tage']],['m','Wie fühlten sich viele am ersten Tag?','unruhig',['erleichtert','gelangweilt und müde','glücklich']],['m','Was veränderte sich ab dem dritten Tag?','Die Jugendlichen unterhielten sich mehr und spielten Tischtennis.',['Alle wollten das Experiment abbrechen.','Die Noten wurden sofort besser.','Die Jugendlichen lasen mehr Bücher.']],['t','Nach dem Experiment wollten die meisten dauerhaft ohne Handy leben.',false],['m','Was beschloss die Klasse am Ende?','beim Lernen das Handy in einen anderen Raum zu legen',['Handys in der Schule zu verbieten','jeden Monat eine handyfreie Woche zu machen','nur noch Tischtennis zu spielen']]]);
tx('Deutsch',[6,7],'Die Bienen und wir','Ein großer Teil unserer Obst- und Gemüsepflanzen ist darauf angewiesen, dass Insekten ihre Blüten bestäuben. Die wichtigste Rolle spielen dabei Bienen. Neben der bekannten Honigbiene gibt es in Deutschland über 500 Wildbienenarten. Viele davon sind gefährdet, weil blühende Wiesen und Nistplätze verschwinden. Auch Pflanzenschutzmittel schaden ihnen. Jeder kann helfen: Schon ein Balkonkasten mit heimischen Blumen oder ein Insektenhotel bietet Nahrung und Unterschlupf.',
[['m','Warum sind Bienen für uns wichtig?','Sie bestäuben viele Obst- und Gemüsepflanzen.',['Sie fressen Schädlinge.','Sie machen den Boden fruchtbar.','Sie vertreiben Wespen.']],['m','Wie viele Wildbienenarten gibt es in Deutschland laut Text?','über 500',['etwa 50','genau 100','über 5000']],['m','Warum sind viele Wildbienen gefährdet?','Blühende Wiesen und Nistplätze verschwinden.',['Es gibt zu viele Honigbienen.','Es ist zu kalt.','Vögel fressen sie.']],['t','Laut Text schaden Pflanzenschutzmittel den Bienen.',true],['m','Welche Absicht verfolgt der Text vor allem?','informieren und zum Handeln anregen',['unterhalten','eine Geschichte erzählen','ein Produkt verkaufen']]]);
tx('Deutsch',[6,7],'Der Wettlauf','Seit Wochen hatte Elias für den Schullauf trainiert. Am Start war er so aufgeregt, dass seine Hände zitterten. Nach dem Startschuss lief er viel zu schnell los und lag bald an der Spitze. Doch nach zwei Runden bekam er Seitenstechen. Einer nach dem anderen überholte ihn. Kurz vor dem Ziel sah er, dass sein Freund Tarik gestürzt war. Ohne lange zu überlegen, blieb Elias stehen und half ihm auf. Gemeinsam liefen sie als Letzte ins Ziel – und bekamen von allen den größten Applaus.',
[['m','Warum zitterten Elias’ Hände am Start?','Er war aufgeregt.',['Es war kalt.','Er hatte sich verletzt.','Er hatte Hunger.']],['m','Welchen Fehler machte Elias beim Rennen?','Er lief zu schnell los.',['Er lief in die falsche Richtung.','Er startete zu spät.','Er vergaß eine Runde.']],['t','Elias gewann das Rennen.',false],['m','Was tat Elias kurz vor dem Ziel?','Er half seinem gestürzten Freund auf.',['Er überholte alle anderen.','Er gab auf und setzte sich hin.','Er rief einen Lehrer.']],['m','Was ist die Botschaft der Geschichte?','Hilfsbereitschaft ist wichtiger als der Sieg.',['Man sollte nie trainieren.','Nur der Sieg zählt.','Freunde stören beim Sport.']]]);
tx('Deutsch',[6,7],'Neuschwanstein','Schloss Neuschwanstein liegt bei Füssen im Allgäu. König Ludwig II. ließ es ab 1869 bauen. Es sollte kein Ort zum Regieren sein, sondern eine Rückzugswelt aus Sagen und Musik. Ludwig bewunderte die Opern von Richard Wagner, deshalb zeigen viele Wandbilder Szenen daraus. Fertig wurde das Schloss nie ganz: Ludwig starb 1886 unter bis heute ungeklärten Umständen im Starnberger See. Wenige Wochen nach seinem Tod wurde das Schloss für Besucher geöffnet. Heute kommen jedes Jahr über eine Million Menschen.',
[['m','Wo liegt Schloss Neuschwanstein?','bei Füssen im Allgäu',['in München','am Chiemsee','in Nürnberg']],['m','Ab wann wurde das Schloss gebaut?','ab 1869',['ab 1769','ab 1886','ab 1918']],['m','Wessen Werke zeigen viele Wandbilder?','Opern von Richard Wagner',['Gemälde von Dürer','Märchen der Brüder Grimm','Gedichte von Goethe']],['t','Das Schloss wurde zu Ludwigs Lebzeiten vollständig fertiggestellt.',false],['m','Wann wurde das Schloss für Besucher geöffnet?','wenige Wochen nach Ludwigs Tod',['erst im Jahr 2000','zur Einweihung 1869','nie']]]);
tx('Deutsch',[8,9],'Fast Fashion','Ein T-Shirt für fünf Euro – solche Angebote sind heute normal. Möglich wird das durch „Fast Fashion“: Modeketten bringen fast jede Woche neue Kollektionen heraus. Die Kleidung wird meist in Ländern wie Bangladesch genäht, wo Arbeiterinnen oft nur wenige Euro am Tag verdienen. Für die Herstellung einer einzigen Jeans werden mehrere Tausend Liter Wasser verbraucht. Viele Kleidungsstücke werden nur wenige Male getragen und landen dann im Müll. Kritiker fordern deshalb, weniger, aber hochwertigere Kleidung zu kaufen, Second-Hand-Angebote zu nutzen und Kleidung zu reparieren.',
[['m','Was versteht man laut Text unter „Fast Fashion“?','Modeketten bringen ständig neue, billige Kollektionen heraus.',['Kleidung, die man beim Sport trägt','besonders schnell trocknende Stoffe','Mode, die nur online verkauft wird']],['m','Welches Problem bei der Herstellung nennt der Text?','sehr niedrige Löhne der Arbeiterinnen',['zu wenige Fabriken','zu teure Baumwolle','zu lange Lieferzeiten']],['t','Laut Text braucht man für eine Jeans mehrere Tausend Liter Wasser.',true],['m','Welche Lösung schlagen Kritiker vor?','weniger, aber hochwertigere Kleidung kaufen',['nur noch neue Kleidung kaufen','Kleidung nach dem ersten Tragen wegwerfen','nur noch Kleidung aus Bangladesch kaufen']],['m','Welche Textsorte liegt vor?','Sachtext mit kritischer Haltung',['Kurzgeschichte','Ballade','Bewerbungsschreiben']]]);
tx('Deutsch',[8,9],'Das Vorstellungsgespräch','Lukas stand vor der Tür des Autohauses und atmete tief durch. Er hatte sich gut vorbereitet: Er wusste, seit wann es den Betrieb gibt, und hatte sich drei Fragen notiert. Im Gespräch fragte ihn die Ausbilderin, warum er Kfz-Mechatroniker werden wolle. Lukas erzählte, dass er seit Jahren mit seinem Onkel an alten Mopeds schraubt. Dann kam die Frage nach seinen Schwächen. Lukas zögerte kurz und gab zu, dass er manchmal ungeduldig sei, aber daran arbeite. Am Ende bedankte er sich für das Gespräch. Eine Woche später kam die Zusage.',
[['m','Wie hatte sich Lukas vorbereitet?','Er informierte sich über den Betrieb und notierte Fragen.',['Er lernte Motorenteile auswendig.','Er bat seinen Onkel, mitzukommen.','Gar nicht – er ging spontan hin.']],['m','Warum möchte Lukas Kfz-Mechatroniker werden?','Er schraubt seit Jahren mit seinem Onkel an Mopeds.',['Sein Vater ist Autoverkäufer.','Er möchte viel Geld verdienen.','Die Ausbildung ist besonders kurz.']],['m','Wie reagierte Lukas auf die Frage nach seinen Schwächen?','Er nannte ehrlich eine Schwäche und dass er daran arbeitet.',['Er behauptete, keine Schwächen zu haben.','Er verließ den Raum.','Er sprach über die Schwächen seines Onkels.']],['t','Lukas bekam am selben Tag eine Absage.',false],['m','Was kann man aus dem Text für ein Vorstellungsgespräch lernen?','Gute Vorbereitung und Ehrlichkeit wirken positiv.',['Man sollte möglichst wenig sprechen.','Fragen an den Betrieb sind unhöflich.','Man sollte Schwächen verschweigen.']]]);
tx('Deutsch',[8,9],'Künstliche Intelligenz in der Schule','Programme mit Künstlicher Intelligenz können heute Texte schreiben, Aufgaben erklären und Fragen beantworten. Befürworter sehen darin eine Chance: Schülerinnen und Schüler könnten individuell gefördert werden, etwa durch Erklärungen im eigenen Lerntempo. Kritiker befürchten dagegen, dass Hausaufgaben einfach von der KI erledigt werden und eigenes Denken verkümmert. Außerdem machen die Programme Fehler, die nicht jeder erkennt. Viele Fachleute empfehlen daher einen Mittelweg: KI im Unterricht gezielt einsetzen, aber lernen, ihre Antworten kritisch zu prüfen.',
[['m','Welche Chance sehen Befürworter?','individuelle Förderung im eigenen Lerntempo',['weniger Schultage','Lehrkräfte werden überflüssig','Noten werden abgeschafft']],['m','Was befürchten Kritiker?','dass eigenes Denken verkümmert',['dass Computer zu teuer werden','dass Schüler zu viel lesen','dass das Internet ausfällt']],['t','Laut Text arbeiten KI-Programme immer fehlerfrei.',false],['m','Was empfehlen viele Fachleute?','KI gezielt einsetzen und Antworten kritisch prüfen',['KI in Schulen verbieten','nur noch mit KI lernen','KI erst ab der Universität nutzen']],['m','Wie ist der Text aufgebaut?','Pro- und Kontra-Argumente, dann ein Fazit',['nur eine Meinung ohne Gegenargumente','chronologische Erzählung','Gedicht mit Strophen']]]);
tx('Deutsch',[8,9],'Die Mutprobe','„Du traust dich ja doch nicht“, sagte Kevin und grinste. Die anderen standen am Bahndamm und warteten. Jana sollte über das Gleis zur anderen Seite laufen, kurz bevor der Regionalzug kam. Ihr Herz klopfte. Sie wollte unbedingt zur Clique gehören. Doch dann dachte sie an ihren kleinen Bruder, der zu Hause auf sie wartete. Jana drehte sich um und sagte mit fester Stimme: „Das ist keine Mutprobe, das ist Dummheit.“ Einige lachten, aber Mira trat neben sie. Gemeinsam gingen die beiden nach Hause.',
[['m','Was sollte Jana tun?','kurz vor dem Zug über das Gleis laufen',['von einer Brücke springen','etwas im Laden stehlen','nachts allein in den Wald gehen']],['m','Warum wollte Jana die Mutprobe zunächst machen?','Sie wollte zur Clique gehören.',['Sie wollte Kevin beeindrucken, weil sie verliebt war.','Sie hatte eine Wette verloren.','Sie mochte Züge.']],['m','Was brachte Jana zum Umdenken?','der Gedanke an ihren kleinen Bruder',['ein Anruf ihrer Mutter','ein Polizist','der Regen']],['t','Am Ende stand niemand auf Janas Seite.',false],['m','Was bedeutet Janas Satz „Das ist keine Mutprobe, das ist Dummheit“?','Echter Mut bedeutet, Nein zu sagen.',['Sie hält Kevin für klug.','Sie möchte es später versuchen.','Sie hat Angst vor Zügen.']]]);

tx('Englisch',[4],'My pet','Hello, my name is Sam. I am nine years old. I have got a dog. His name is Max. Max is brown and white. He likes to play in the garden. Every morning I give him food and water. On Saturday we go to the park. Max can run very fast!',
[['m','Wie heißt der Junge?','Sam',['Max','Tom','Ben']],['m','Welches Tier hat Sam?','einen Hund',['eine Katze','einen Hasen','einen Vogel']],['m','Welche Farbe hat Max?','braun und weiß',['schwarz','grau und weiß','rot']],['t','Sam geht am Samstag mit Max in den Park.',true],['m','Wie alt ist Sam?','neun',['acht','zehn','elf']]]);
tx('Englisch',[4],'At the market','It is Saturday. Emma and her mum are at the market. They want to buy fruit. Emma likes apples and bananas. Mum buys six apples and four bananas. Then Emma sees strawberries. „Can we buy strawberries, please?“ she asks. „Yes, but only one box“, says mum. At home they make a fruit salad.',
[['m','Wo sind Emma und ihre Mama?','auf dem Markt',['in der Schule','im Park','im Kino']],['m','Wie viele Äpfel kauft Mama?','sechs',['vier','zwei','zehn']],['m','Was möchte Emma noch kaufen?','Erdbeeren',['Kirschen','Orangen','Eis']],['t','Sie kaufen drei Schachteln Erdbeeren.',false],['m','Was machen sie zu Hause?','einen Obstsalat',['einen Kuchen','Saft','Pizza']]]);
tx('Englisch',[5,6],'A new school','Hi, I’m Lucy and I’m eleven. Last week I started at a new school in Bristol. On my first day I was very nervous because I didn’t know anybody. My teacher, Mr Brown, is very friendly. In the break a girl called Aisha asked me to play basketball with her. Now she is my best friend. My favourite subject is art, but I don’t like maths very much. After school I go to the drama club on Wednesdays.',
[['m','Where is Lucy’s new school?','in Bristol',['in London','in Manchester','in Oxford']],['m','How did Lucy feel on her first day?','nervous',['happy','angry','tired']],['m','Who is Aisha?','Lucy’s new best friend',['her teacher','her sister','the head teacher']],['t','Lucy’s favourite subject is maths.',false],['m','When does Lucy go to the drama club?','on Wednesdays',['on Mondays','on Fridays','every day']]]);
tx('Englisch',[5,6],'Ben’s weekend','On Saturday Ben got up at eight o’clock. He had breakfast with his family: toast with jam and a cup of hot chocolate. Then he went to football training. His team played a match against the Red Lions and won 3:1. Ben scored one goal! In the afternoon it rained, so Ben stayed at home and played computer games with his brother. On Sunday the family visited grandma. She made a big chocolate cake.',
[['m','What time did Ben get up on Saturday?','at eight o’clock',['at seven o’clock','at nine o’clock','at ten o’clock']],['m','What did Ben drink for breakfast?','hot chocolate',['orange juice','tea','milk']],['m','What was the result of the match?','Ben’s team won 3:1.',['Ben’s team lost 1:3.','It was 1:1.','The Red Lions won 3:1.']],['t','The weather was sunny all afternoon.',false],['m','Who made a chocolate cake?','grandma',['Ben’s mum','Ben','Ben’s brother']]]);

function startTextProbe(mode){const k=kid(),f=SET.fach,kl=SET.kl,list=txFor(f,kl,mode);if(!list.length){note('Für dieses Fach und diese Klasse gibt es keine Texte.');return}
 const done=new Set(S.attempts.filter(a=>a.kidId===k.id&&a.pasId).map(a=>a.pasId)),fresh=list.filter(t=>!done.has(t.id)),t=pick(fresh.length?fresh:list);

function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/[−–]/g,'-').replace(/\s/g,'');if(!s)return NaN;
 if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN}
function normText(s,it){s=String(s??'').replace(/[„“”"‚‘’`´']/g,'').replace(/\s+/g,' ').trim().replace(/[.!]+$/,'').replace(/ ?uhr$/i,'');
 if(!it.cs)s=s.toLowerCase();if(it.ns)s=s.replace(/\s/g,'');if(it.en)s=s.replace(/^(to|the|a|an) /i,'');if(it.nd)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'');return s}
function decFrac(t){const neg=t.startsWith('-');t=t.replace('-','');const[i,f='']=t.split(/[.,]/);const n=+(i+f);return[neg?-n:n,10**f.length]}
function nums(s){return(String(s??'').replace(/[−–]/g,'-').replace(/[a-zäöü]+\d*/gi,' ').match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')))}
function termClean(s){return String(s??'').toLowerCase().replace(/^\s*(y|f\s*\(\s*x\s*\))\s*=/,'').replace(/[·×⋅]/g,'*').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\s+/g,'')}
function termFn(s){let c=termClean(s);if(!c||!/^[0-9x.+\-*/()^]+$/.test(c))return null;c=c.replace(/(\d|x|\))(?=[x(])/g,'$1*').replace(/(^|[(*/^])-/g,'$1(-1)*').replace(/\^/g,'**');try{const f=new Function('x','"use strict";return('+c+')');return typeof f(1.3)==='number'?f:null}catch(e){return null}}
function termEq(f,g){return[-2.3,-0.7,0.4,1.9,3.1].every(x=>{const a=f(x),b=g(x);return isFinite(a)&&isFinite(b)&&Math.abs(a-b)<=1e-6*(1+Math.abs(b))})}
function parseFrac(s){s=String(s??'').trim().replace(/[−–]/g,'-').replace(/\s+/g,' ');let m;
 if(/^-?\d+[.,]\d+$/.test(s))return decFrac(s);
 if(m=s.match(/^(-?\d+(?:[.,]\d+)?) ?%$/)){const f=decFrac(m[1]);return[f[0],f[1]*100]}
 if(m=s.match(/^(-?)(\d+) (\d+) ?\/ ?(\d+)$/)){const sg=m[1]?-1:1;return[sg*(+m[2]*+m[4]+ +m[3]),+m[4]]}
 if(m=s.match(/^(-?\d+) ?\/ ?(\d+)$/))return[+m[1],+m[2]];
 if(m=s.match(/^-?\d+$/))return[+s,1];return null}
function isCorrect(it,g){if(g==null||String(g).trim()==='')return false;
 switch(it.t){
  case'num':{const x=parseNum(String(g).replace(/^\s*[a-z]\s*=/i,''));return!isNaN(x)&&Math.abs(x-it.a)<=(it.tol||Math.max(1e-12,Math.abs(it.a)*1e-9))}
  case'text':{const n=normText(g,it);return it.a.some(a=>normText(a,it)===n)||lrsOk(it,g)}
  case'steps':return stepOk(it,g).every(Boolean);
  case'frac':{const f=parseFrac(g);if(!f||!f[1])return false;if(f[0]*it.a[1]!==it.a[0]*f[1])return false;return!it.red||gcd(f[0],f[1])===1}
  case'term':{const f=termFn(g),e=termFn(it.a);if(!f||!e||!termEq(f,e))return false;const c=termClean(g);if(it.np&&/[()]/.test(c))return false;if(it.short&&c.replace(/\*/g,'').length>termClean(it.a).replace(/\*/g,'').length+2)return false;return true}
  case'pair':{let n=nums(g),a=[...it.a];if(it.uo){n=[...new Set(n)].sort((x,y)=>x-y);a=[...new Set(a)].sort((x,y)=>x-y)}return n.length===a.length&&n.every((v,i)=>Math.abs(v-a[i])<=(it.tol||1e-6))}
  case'multi':{const g2=String(g).split(SEP).filter(Boolean).sort(),a2=[...it.a].sort();return g2.length===a2.length&&g2.every((x,i)=>x===a2[i])}
  case'order':case'match':return String(g)===it.a.join(SEP);
  default:return g===it.a}}
function correctDisplay(it){switch(it.t){
 case'num':return(it.disp??(it.yr?String(it.a):fmtNum(it.a)))+(it.unit?' '+it.unit:'');
 case'term':return esc(it.a);
 case'pair':return it.uo?it.a.map(fmtNum).join(' ; '):'('+it.a.map(fmtNum).join(' | ')+')';
 case'text':return esc(it.a[0]);
 case'frac':return it.a[1]===1?String(it.a[0]):`${it.a[0]}/${it.a[1]}`;
 case'frei':return it.sol?esc(it.sol):'(Bewertung durch Eltern)';
 case'multi':return it.a.map(esc).join(', ');
 case'order':return it.a.map(esc).join(' → ');
 case'match':return it.left.map((l,i)=>esc(l)+' = '+esc(it.a[i])).join('; ');
 case'steps':return it.steps.map(x=>esc(x[0])+' '+fmtNum(x[1])).join(' · ');
 default:return esc(it.a)}}
function mini(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__([^_]+?)__/g,'<u>$1</u>').replace(/\^(-?\w+)/g,'<sup>$1</sup>').replace(/\n/g,'<br>')}
function htmlToMini(h){return String(h).replace(/<\/div>/g,'\n').replace(/<br\s*\/?>/g,'\n').replace(/<span class="muted">.*?<\/span>/g,'').replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<u>(.*?)<\/u>/g,'__$1__').replace(/<b>(.*?)<\/b>/g,'**$1**').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').trim()}
const renderQ=it=>it.qh??mini(it.q);
const qKey=it=>(it.qh??it.q)+'|'+JSON.stringify(it.a)+(it.t==='mc'||it.t==='multi'?'|'+[...(it.opts||[])].sort().join(','):'');

 o.innerHTML=`<div class="dlgbox" role="dialog"><div class="dlgmsg">${esc(msg).replace(/\n/g,'<br>')}</div><div class="row" style="justify-content:flex-end;margin-top:16px">${cancel?`<button class="btn sec" data-r="0">${esc(cancel)}</button>`:''}<button class="btn" data-r="1">${esc(ok)}</button></div></div>`;
 o.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;o.remove();res(b.dataset.r==='1')});document.body.appendChild(o);o.querySelector('[data-r="1"]').focus()})}

const STOPW=new Set(('Der Die Das Den Dem Des Ein Eine Einer Eines Einem Einen Im In Am An Auf Aus Bei Mit Nach Von Vor Zu Zum Zur Und Oder Aber Als Wie Wenn Weil Dass Er Sie Es Wir Ihr Man Sein Seine Seiner Seinen Seinem Ihre Ihren Ihrem Dieser Diese Dieses Diesen Jahr Jahre Jahren Jahrhundert Jahrhunderts Zeit Teil Teile Teilen Ende Anfang Beginn Beispiel Art Weise Welt Menschen Mensch Leben Namen Name Zahl Grund Form Fall Bereich Rahmen Folge Hilfe Lage Seite Stelle Ort Orte Mal Hälfte Anzahl Reihe Gruppe Heute Später Damals Dort Hier Auch Doch Noch Nur Sehr Viele Vielen Einige Andere Anderen Allem Dabei Daher Danach Deshalb Jedoch Außerdem Insgesamt Etwa Rund Unter Über Durch Gegen Ohne Während Bis Seit Neben Zwischen Laut Mehr Meist Meisten').split(' '));
let AUTOPL=[];const WRX=/[A-ZÄÖÜ][a-zäöüß]{3,}/g,YRX=/\b(1[0-9]{3}|20[0-2]\d)\b/g;
const wordRe=w=>new RegExp('(?<![A-Za-zÄÖÜäöüß])'+w+'(?![A-Za-zÄÖÜäöüß])');
function sentences(text){
 let t=text.replace(/\s*\([^()]*\)/g,'').replace(/\s*\([^()]*\)/g,'').replace(/\s*\[[^\]]*\]/g,'');
 [['z. B.','z§B§'],['u. a.','u§a§'],['d. h.','d§h§'],['v. Chr.','v§Chr§'],['n. Chr.','n§Chr§'],['bzw.','bzw§'],['ca.','ca§'],['St.','St§'],['Nr.','Nr§'],['Dr.','Dr§'],['usw.','usw§'],['vgl.','vgl§'],['Jh.','Jh§'],['etc.','etc§'],['evtl.','evtl§'],['sog.','sog§'],['bzw.','bzw§'],['u. ä.','u§ä§']].forEach(([a,b])=>t=t.split(a).join(b));
 t=t.replace(/(\d)\.(?= (?:Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember|Jahrhundert|Jh|[a-zäöü\d]))/g,'$1§').replace(/\b([A-ZÄÖÜ])\.(?= )/g,'$1§');
 return t.split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ„"])/).map(s=>s.replace(/§/g,'.').trim()).filter(s=>s.length>=35&&s.length<=240&&/[.!]$/.test(s))}
function kwFreq(sents){const f={};sents.forEach(s=>{for(const m of s.matchAll(WRX)){if(m.index>0&&!STOPW.has(m[0]))f[m[0]]=(f[m[0]]||0)+1}});return f}
function candWords(s,topicW){return[...s.matchAll(WRX)].filter(m=>m.index>0&&!STOPW.has(m[0])&&!topicW.has(m[0].toLowerCase())).map(m=>m[0]).filter((w,_,a)=>a.indexOf(w)===a.lastIndexOf(w))}
function distract(w,s,f,topicW){const pool=Object.keys(f).filter(x=>x!==w&&!s.includes(x)&&!topicW.has(x.toLowerCase()));return shuffle(shuffle(pool).sort((a,b)=>Math.abs(a.length-w.length)-Math.abs(b.length-w.length)).slice(0,8)).slice(0,3)}
function makeQ(s,kind,f,topicW){
 const yrs=s.match(YRX)||[];
 if(kind==='num'){
  if(yrs.length===1)return{t:'num',qh:`„${esc(s.replace(yrs[0],'______'))}“<br>Welche Jahreszahl gehört in die Lücke?`,a:+yrs[0],p:1,yr:1};
  const ns=[...s.matchAll(/(?<![\d.,])(\d{1,5})(?![\d.,]?\d)(?!\.)/g)].map(x=>x[1]).filter(x=>!yrs.includes(x)&&+x>1);
  if(ns.length===1)return{t:'num',qh:`„${esc(s.replace(new RegExp('(?<!\\d)'+ns[0]+'(?!\\d)'),'______'))}“<br>Welche Zahl gehört in die Lücke?`,a:+ns[0],p:1};
  return null}
 if(kind==='mc'){const c=candWords(s,topicW);if(!c.length)return null;const w=c.sort((a,b)=>(f[b]||0)-(f[a]||0))[0],ds=distract(w,s,f,topicW);if(ds.length<3)return null;
  return{t:'mc',qh:`„${esc(s.replace(wordRe(w),'______'))}“<br>Welches Wort gehört in die Lücke?`,a:w,opts:shuffle([w,...ds]),p:1}}
 if(kind==='tf'){if(Math.random()<.5)return{t:'tf',qh:`Stimmt diese Aussage?<br>„${esc(s)}“`,a:'wahr',p:1};
  if(yrs.length){const y=yrs[0],ny=String(+y+pick([-1,1])*R(3,40));return{t:'tf',qh:`Stimmt diese Aussage?<br>„${esc(s.replace(y,ny))}“`,a:'falsch',p:1}}
  const pl=[...s.matchAll(/(?:in|nach|aus) ([A-ZÄÖÜ][a-zäöüß]+)/g)].map(x=>x[1]).filter(x=>AUTOPL.includes(x));if(!pl.length)return null;const o=shuffle(AUTOPL.filter(x=>x!==pl[0]&&!s.includes(x)))[0];if(!o)return null;
  return{t:'tf',qh:`Stimmt diese Aussage?<br>„${esc(s.replace(wordRe(pl[0]),o))}“`,a:'falsch',p:1}}
 return null}

function splitSVR(s,f){let t=s.replace(/[.!]$/,'');const ci=t.indexOf(',');if(ci>0)t=t.slice(0,ci);
 const w=t.split(' ');if(w.length<4)return null;let i=0,subj;

 else{while(i<w.length&&i<4&&/^[A-ZÄÖÜ][a-zäöüß\-]*$/.test(w[i]))i++;if(!i)return null;if(i===1&&!f[w[0]])return null;subj=w.slice(0,i).join(' ')}
 const v=w[i];if(!v||!/^[a-zäöüß]+$/.test(v)||FIN_STOP.has(v))return null;
 return{subj,verb:v,rest:w.slice(i+1).join(' ')}}
const cut=(r,m)=>(r.slice(0,m.index)+' '+r.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim();
const qq=(w,x,r)=>`${w} ${x.verb} ${x.subj}${r?' '+r:''}?`;
function yearQ(x){const m=x.rest.match(/(?:^|\s)((?:im Jahre?|am \d{1,2}\. [A-ZÄÖÜ][a-zä]+) )?(1[0-9]{3}|20[0-2]\d)(?=\s|$)/);if(!m)return null;
 const before=x.rest.slice(0,m.index).trim().split(' ').pop()||'';if(!m[1]&&/^(seit|bis|ab|vor|nach|um|von|zwischen|gegen|etwa|rund|ca\.)$/i.test(before))return null;
 return{t:'num',qh:esc(qq('In welchem Jahr',x,cut(x.rest,m))),a:+m[2],p:1,yr:1}}
function placeQ(x,places){const m=x.rest.match(/(?:^|\s)(in|nach) ([A-ZÄÖÜ][a-zäöüß]+)(?=\s|$)/);if(!m)return null;const P=m[2];
 if(PLACESTOP.has(P)||STOPW.has(P)||x.subj.includes(P)||!places.includes(P))return null;
 const ds=shuffle(places.filter(p=>p!==P)).slice(0,3);if(ds.length<2)return null;
 return{t:'mc',qh:esc(qq(m[1]==='nach'?'Wohin':'Wo',x,cut(x.rest,m))),a:P,opts:shuffle([P,...ds]),p:1}}
function countQ(x){const m=x.rest.match(/(?:^|\s)((?:über|rund|etwa|mehr als|fast|knapp) )?(\d{1,3}(?:\.\d{3})*|\d{1,6}) ([A-ZÄÖÜ][a-zäöüß]+)(?=\s|$)/);if(!m)return null;
 const n=+m[2].replace(/\./g,'');if(n<2||(n>=1000&&n<=2100&&!m[2].includes('.')))return null;
 const bw=x.rest.slice(0,m.index).trim().split(' ').slice(-2);if(bw.some(w=>PREPN.test(w)))return null;
 return{t:'num',qh:esc(qq(`Wie viele ${m[3]}`,x,cut(x.rest,m)))+(m[1]?M(`(laut Text „${m[1].trim()} …“ – gib die Zahl an)`):''),a:n,p:1}}
function leadYearQ(s){let t=s.replace(/[.!]$/,'');const ci=t.indexOf(',');if(ci>0)t=t.slice(0,ci);
 const m=t.match(/^(?:Im Jahre? |Am \d{1,2}\. [A-ZÄÖÜ][a-zä]+ )?(1[0-9]{3}|20[0-2]\d) ([a-zäöüß]+ .{8,})$/);if(!m||FIN_STOP.has(m[2].split(' ')[0]))return null;
 return{t:'num',qh:esc(`In welchem Jahr ${m[2]}?`),a:+m[1],p:1,yr:1}}
function wQuestions(S_,f){const cnt={};for(const s of S_)for(const m of s.matchAll(/\b(?:in|nach|aus) ([A-ZÄÖÜ][a-zäöüß]+)(?=[\s.,])/g)){const P=m[1];if(!PLACESTOP.has(P)&&!STOPW.has(P))cnt[P]=(cnt[P]||0)+1}
 const places=Object.keys(cnt),out=[],seen=new Set();AUTOPL=places;
 for(const s of S_){const qs=[];const l=leadYearQ(s);if(l)qs.push(l);else{const x=splitSVR(s,f);if(x)[yearQ(x),placeQ(x,places),countQ(x)].forEach(q=>q&&qs.push(q))}
  for(const q of qs){if(!seen.has(q.qh)){seen.add(q.qh);q.sol='Im Text: '+s;out.push(q)}}}
 return out}
function autoGen(text,topic,n){
 const S_=sentences(text);if(S_.length<3)return[];
 const f=kwFreq(S_),topicW=new Set(topic.toLowerCase().split(/[\s\-–,]+/).filter(Boolean));
 const W=shuffle(wQuestions(S_,f)).slice(0,Math.ceil(n*.7));
 const usedS=new Set(W.map(q=>q.sol));
 const sc=S_.map((s,i)=>{const ws=s.match(WRX)||[];return{s,sc:ws.reduce((a,w)=>a+(f[w]||0),0)/Math.sqrt(ws.length+1)-i*.03+Math.random()*.5}}).sort((a,b)=>b.sc-a.sc);
 const kinds=['tf','mc','tf','num'],out=[...W];let k=0;
 for(const{s}of sc){if(out.length>=n)break;if(usedS.has('Im Text: '+s))continue;const it=makeQ(s,kinds[k%kinds.length],f,topicW)||makeQ(s,'tf',f,topicW)||makeQ(s,'mc',f,topicW);
  if(it){usedS.add('Im Text: '+s);it.sol='Im Text: '+s;delete it.sol0;out.push(it);k++}}
 return shuffle(out).slice(0,n).map(it=>({...it,th:topic}))}

function normKI(o){if(!o||!o.q)return null;const b={q:String(o.q),p:Math.max(1,Math.min(3,Math.round(+o.p)||1)),sol:String(o.sol||'')};
 switch(o.t){
  case'mc':{const a=String(o.a),w=[...new Set((o.opts||[]).map(String))].filter(x=>x!==a).slice(0,3);if(!w.length)return null;return{...b,t:'mc',a,opts:shuffle([a,...w])}}
  case'tf':return{...b,t:'tf',a:/^(f|n)/i.test(String(o.a))?'falsch':'wahr'};
  case'num':{const a=parseNum(String(o.a));if(isNaN(a))return null;return{...b,t:'num',a,unit:String(o.unit||''),yr:Number.isInteger(a)&&a>=1000&&a<=2100&&/jahr/i.test(b.q)?1:0}}
  case'text':{const a=(Array.isArray(o.a)?o.a:[o.a]).map(String).filter(Boolean);return a.length?{...b,t:'text',a}:null}
  case'multi':{const op=[...new Set((o.opts||[]).map(String))],a=(Array.isArray(o.a)?o.a:[o.a]).map(String).filter(x=>op.includes(x));return op.length>=3&&a.length?{...b,t:'multi',a,opts:shuffle(op)}:null}
  case'order':{const a=(Array.isArray(o.a)?o.a:[]).map(String);return a.length>=3?{...b,t:'order',a,opts:shuffle(a)}:null}
  case'match':{const pr=(o.pairs||[]).filter(x=>Array.isArray(x)&&x.length===2).map(x=>[String(x[0]),String(x[1])]);return pr.length>=3?{...b,t:'match',left:pr.map(x=>x[0]),a:pr.map(x=>x[1]),rights:shuffle([...new Set(pr.map(x=>x[1]))])}:null}}
 return null}

function kiPrompt(text,topic,n,opt={}){return `Erstelle ${n} Übungsaufgaben für eine Probe an ${SET.sa==='gym'?'einem bayerischen Gymnasium':'einer bayerischen '+SCHULEN[SET.sa].n}, Jahrgangsstufe ${SET.kl}, Fach ${ON.fach}, Thema „${topic}“.
${opt.heft?`Grundlage ist ein Hefteintrag bzw. Arbeitsblatt aus dem Unterricht${opt.img===undefined?' (falls angehängt, als Foto)':opt.img?' (als Foto angehängt)':''}. Verwende ausschließlich dessen Inhalte und orientiere dich an Fachbegriffen und Schreibweisen daraus.${text?`\nAbgetippter Inhalt:\n"""\n${text.slice(0,12000)}\n"""`:''}`:text?`Verwende ausschließlich Fakten aus diesem Lexikontext:\n"""\n${text.slice(0,12000)}\n"""`:'Verwende nur gesichertes, unstrittiges Schulwissen.'}

Anforderungen:
- Sprache, Wortschatz und Schwierigkeit passend zur Jahrgangsstufe ${SET.kl} (LehrplanPLUS Bayern).
- Echte Prüfungsfragen (Wer, Was, Wann, Wo, Warum, Wie viele …), keine Lückentexte.
- Gemischte Aufgabentypen: "mc" (genau 4 Antwortmöglichkeiten, genau eine richtig, plausible falsche Antworten), "tf" (Aussage, richtig oder falsch), "num" (eindeutige Zahl, z. B. Jahreszahl oder Anzahl), "text" (Antwort aus ein bis zwei Wörtern, alle sinnvollen Schreibweisen angeben).
- Wo es passt, auch: "multi" (mehrere richtige Antworten; "a" = Liste der richtigen, "opts" = alle 4–6 Möglichkeiten), "order" (in die richtige Reihenfolge bringen; "a" = Liste in richtiger Reihenfolge), "match" (zuordnen; "pairs" = Liste von [links, rechts]).
- Jede Aufgabe muss für sich allein verständlich und eindeutig lösbar sein (nicht „laut Text“), keine Fangfragen.
- Punkte "p": 1 für einfache, 2 für anspruchsvollere Aufgaben.
- "sol": ein kurzer Satz, der die Lösung erklärt.

Gib NUR ein JSON-Array in einem einzigen Codeblock aus, ohne weiteren Text, im Format:
[{"t":"mc","q":"…","a":"richtige Antwort","opts":["richtige Antwort","falsch 1","falsch 2","falsch 3"],"p":1,"sol":"…"},
{"t":"tf","q":"Aussage …","a":"wahr","p":1,"sol":"…"},
{"t":"num","q":"…","a":1756,"unit":"","p":1,"sol":"…"},
{"t":"text","q":"…","a":["Antwort","Alternative"],"p":1,"sol":"…"},
{"t":"multi","q":"…","a":["richtig 1","richtig 2"],"opts":["richtig 1","richtig 2","falsch 1","falsch 2"],"p":2,"sol":"…"},
{"t":"order","q":"Bringe in die richtige Reihenfolge …","a":["erstens","zweitens","drittens"],"p":2,"sol":"…"},
{"t":"match","q":"Ordne zu …","pairs":[["links 1","rechts 1"],["links 2","rechts 2"],["links 3","rechts 3"]],"p":2,"sol":"…"}]`}
function parseKI(raw,n,topic){const i0=raw.indexOf('['),i1=raw.lastIndexOf(']');if(i0<0||i1<i0)throw new Error('Kein Aufgabenformat gefunden – bitte die komplette Antwort (den Codeblock) einfügen.');
 let arr;const js=raw.slice(i0,i1+1);try{arr=JSON.parse(js)}catch(e){try{arr=JSON.parse(js.replace(/[“”]/g,'"'))}catch(e2){throw new Error('Die Antwort ist kein gültiges JSON. Am besten den Kopieren-Knopf am Codeblock in Claude benutzen.')}}
 return arr.map(normKI).filter(Boolean).slice(0,n).map(it=>({...it,th:topic}))}
async function kiGen(text,topic,n,opt={}){
 const key=getKey();if(!key)throw new Error('Kein API-Schlüssel hinterlegt.');
 const c=new AbortController(),tm=setTimeout(()=>c.abort(),120000);let r,d;
 try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:c.signal,headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:ON.model,max_tokens:4000,messages:[{role:'user',content:opt.img?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:opt.img}},{type:'text',text:kiPrompt(text,topic,n,{heft:1,img:1})}]:kiPrompt(text,topic,n,opt)}]})});d=await r.json()}finally{clearTimeout(tm)}
 if(!r.ok)throw new Error((d&&d.error&&d.error.message)||('HTTP '+r.status));
 return parseKI((d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''),n,topic)}

let TTSV=[],TTSU=[],TTSWARN=0,TTSLAST={};
function ttsHelp(c){const ios=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document,frame=window.top!==window;
 return `Es kommt kein Ton${c?` (Fehler: ${c})`:''}.\n\n`+(ios?'• iPhone/iPad: Stummmodus ausschalten (Schalter an der Seite bzw. Kontrollzentrum → Glocke). Bei Stummmodus bleibt das Vorlesen stumm, auch wenn Videos Ton haben.\n':'')+
 '• Lautstärke während des Vorlesens hochdrehen (Medienlautstärke).\n'+(c==='language-unavailable'||c==='voice-unavailable'||!ttsVoice('de-DE')?'• Es ist keine deutsche Stimme installiert: '+(ios?'Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Deutsch.':'Einstellungen → Text-in-Sprache (Sprachausgabe) → Google-Sprachdienst → Sprachdaten Deutsch installieren.')+'\n':'')+
 (frame?'• Die App läuft gerade eingebettet (z. B. in der Claude-App). Dort kann das Vorlesen gesperrt sein – Datei bzw. eigene Web-Adresse direkt in Safari/Chrome öffnen.\n':'')+(c==='not-allowed'?'• Der Browser hat das Vorlesen blockiert – einmal direkt auf 🔊 tippen.\n':'')}
function ttsTest(){const out=$('#ttsOut');if(!HAS_TTS){out.innerHTML='❌ Dieser Browser unterstützt keine Sprachausgabe.';return}ttsVoices();const de=ttsVoice('de-DE'),en=ttsVoice('en-GB');TTSWARN=1;speak('Hallo! Das ist ein Test. Kannst du mich hören?','de-DE',.95);
 out.innerHTML=`⏳ Spreche … (bitte Lautstärke prüfen)<br>Stimmen auf dem Gerät: ${TTSV.length} · Deutsch: ${de?esc(de.name):'❌ keine'} · Englisch: ${en?esc(en.name):'❌ keine'} · eingebettet: ${window.top!==window?'ja':'nein'}`;
 setTimeout(()=>{const ok=TTSLAST.ok,er=TTSLAST.err,sp=speechSynthesis.speaking;out.innerHTML+=`<br><b>${ok||sp?'✅ Die Sprachausgabe läuft'+(TTSLAST.v?' ('+esc(TTSLAST.v)+')':'')+'. Wenn du nichts hörst, liegt es an Lautstärke oder Stummmodus.':er?'❌ Fehler: '+esc(er):'❌ Die Sprachausgabe startet nicht.'}</b>${ok||sp?'':'<div class="hint" style="margin-top:8px;white-space:pre-line">'+esc(ttsHelp(er||''))+'</div>'}`;TTSWARN=0},3000)}
function ttsVoices(){try{TTSV=speechSynthesis.getVoices()||[]}catch(e){}}
if(HAS_TTS){ttsVoices();try{speechSynthesis.onvoiceschanged=ttsVoices}catch(e){}}
function ttsVoice(lang){if(!TTSV.length)ttsVoices();const L=lang.toLowerCase().replace('_','-'),vs=TTSV.filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').slice(0,2)===L.slice(0,2));
 return vs.find(v=>v.lang.toLowerCase().replace('_','-')===L&&v.localService)||vs.find(v=>v.lang.toLowerCase().replace('_','-')===L)||vs.find(v=>v.localService)||vs[0]||null}
function speak(text,lang,rate,warn){if(!HAS_TTS)return false;const ss=speechSynthesis;lang=lang||'de-DE';
 const segs=Array.isArray(text)?text:[[text,lang]],parts=segs.flatMap(([tt,ll])=>(String(tt).replace(/\s+/g,' ').trim().match(/[^.!?;:]{1,180}[.!?;:]?/g)||[]).filter(x=>x.trim()).map(x=>[x,ll||lang]));if(!parts.length)return true;
 const go=()=>{try{if(ss.paused)ss.resume();let started=false;TTSU=parts.map(([p,pl])=>{const u=new SpeechSynthesisUtterance(p);u.lang=pl;u.rate=rate||.9;const v=ttsVoice(pl);if(v)u.voice=v;u.onstart=()=>{started=true;TTSLAST={ok:1,v:u.voice&&u.voice.name}};u.onerror=e=>{const c=e&&e.error||'unbekannt';TTSLAST={err:c};if(c!=='interrupted'&&c!=='canceled'&&warn&&!TTSWARN){TTSWARN=1;note(ttsHelp(c))}};return u});TTSLAST={};
  TTSU.forEach(u=>ss.speak(u));
  setTimeout(()=>{if(warn&&!started&&!ss.speaking&&!TTSWARN){TTSWARN=1;note(ttsHelp('')+'\n\nAusführlicher Test: Einstellungen → „Vorlesen testen“.')}},4000)}catch(e){}};
 try{if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,150)}else go();return true}catch(e){return false}}
function sayIt(r){const it=RUN.items[RUN.idx];if(!speak(it.say,it.lang,r,1))note('Vorlesen wird von diesem Browser nicht unterstützt.')}
function readQ(w=1){const it=RUN.items[RUN.idx],d=new DOMParser().parseFromString(renderQ(it),'text/html');d.querySelectorAll('svg,code,table,.muted,.emo,.mauer,pre').forEach(e=>e.remove());
 let t=d.body.textContent.replace(/_{3,}|…/g,' Lücke ');if(it.t==='mc'||it.t==='multi')t+='. Antworten: '+it.opts.join('. ');const P_=it.pas,segs=[];if(P_&&P_.m==='l')segs.push([P_.ti+'. '+P_.tx,P_.lang==='la'?'it-IT':P_.lang]);segs.push([t,P_?P_.ql:'de-DE']);if(!speak(segs,'de-DE',.95,w))note('Vorlesen wird von diesem Browser nicht unterstützt.')}

/* ---------- SVG-Grafiken ---------- */
function clockSVG(h,m){const c=90,r=80;let s=`<svg viewBox="0 0 180 180" width="170" height="170" class="gfx"><circle cx="${c}" cy="${c}" r="${r}" fill="#fff" stroke="#1d2433" stroke-width="4"/>`;
 for(let i=0;i<60;i++){const a=i*Math.PI/30,l=i%5?6:12;s+=`<line x1="${f1(c+Math.sin(a)*(r-2))}" y1="${f1(c-Math.cos(a)*(r-2))}" x2="${f1(c+Math.sin(a)*(r-2-l))}" y2="${f1(c-Math.cos(a)*(r-2-l))}" stroke="#1d2433" stroke-width="${i%5?1:3}"/>`}
 for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${f1(c+Math.sin(a)*(r-27))}" y="${f1(c-Math.cos(a)*(r-27)+6)}" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2433">${i}</text>`}
 const ha=((h%12)+m/60)*Math.PI/6,ma=m*Math.PI/30;
 return s+`<line x1="${c}" y1="${c}" x2="${f1(c+Math.sin(ha)*42)}" y2="${f1(c-Math.cos(ha)*42)}" stroke="#1d2433" stroke-width="7" stroke-linecap="round"/><line x1="${c}" y1="${c}" x2="${f1(c+Math.sin(ma)*64)}" y2="${f1(c-Math.cos(ma)*64)}" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><circle cx="${c}" cy="${c}" r="5" fill="#1d2433"/></svg>`}
function pieSVG(n,d){const c=80,r=70;let s=`<svg viewBox="0 0 160 160" width="150" height="150" class="gfx">`;
 for(let i=0;i<d;i++){const a0=i/d*2*Math.PI-Math.PI/2,a1=(i+1)/d*2*Math.PI-Math.PI/2;s+=`<path d="M${c},${c} L${f1(c+r*Math.cos(a0))},${f1(c+r*Math.sin(a0))} A${r},${r} 0 ${1/d>.5?1:0} 1 ${f1(c+r*Math.cos(a1))},${f1(c+r*Math.sin(a1))} Z" fill="${i<n?'#f59e0b':'#fff'}" stroke="#1d2433" stroke-width="2"/>`}
 return s+'</svg>'}
function gridSVG(px,py,neg){const lo=neg?-5:0,hi=neg?5:8,cs=22,o=28,W=(hi-lo)*cs+o*2,X=v=>o+(v-lo)*cs,Y=v=>o+(hi-v)*cs;let s=`<svg viewBox="0 0 ${W} ${W}" width="${Math.min(W,260)}" class="gfx">`;
 for(let v=lo;v<=hi;v++){s+=`<line x1="${X(v)}" y1="${Y(lo)}" x2="${X(v)}" y2="${Y(hi)}" stroke="#e2e6ee"/><line x1="${X(lo)}" y1="${Y(v)}" x2="${X(hi)}" y2="${Y(v)}" stroke="#e2e6ee"/>`;
  if(v)s+=`<text x="${X(v)}" y="${Y(neg?0:lo)+15}" font-size="10" text-anchor="middle" fill="#6b7385">${v}</text><text x="${X(neg?0:lo)-8}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#6b7385">${v}</text>`}
 const ax=neg?0:lo;s+=`<line x1="${X(lo)}" y1="${Y(ax)}" x2="${X(hi)+6}" y2="${Y(ax)}" stroke="#1d2433" stroke-width="2"/><line x1="${X(ax)}" y1="${Y(lo)}" x2="${X(ax)}" y2="${Y(hi)-6}" stroke="#1d2433" stroke-width="2"/><text x="${X(hi)+4}" y="${Y(ax)-6}" font-size="12">x</text><text x="${X(ax)+6}" y="${Y(hi)-2}" font-size="12">y</text>`;
 return s+`<circle cx="${X(px)}" cy="${Y(py)}" r="6" fill="#dc2626"/><text x="${X(px)+8}" y="${Y(py)-8}" font-size="14" font-weight="700" fill="#dc2626">A</text></svg>`}
const NOTEN_N=['c','d','e','f','g','a','h','c','d','e','f','g'];
function staffSVG(i){const b=110,sp=12,y=b-(i-2)*sp/2,x=150;let s=`<svg viewBox="0 0 240 150" width="240" class="gfx">`;
 for(let k=0;k<5;k++)s+=`<line x1="10" y1="${b-k*sp}" x2="230" y2="${b-k*sp}" stroke="#1d2433" stroke-width="1.5"/>`;
 s+=`<text x="18" y="${b+8}" font-size="62" fill="#1d2433">𝄞</text>`;
 if(i===0)s+=`<line x1="${x-16}" y1="${b+sp}" x2="${x+16}" y2="${b+sp}" stroke="#1d2433" stroke-width="1.5"/>`;
 return s+`<ellipse cx="${x}" cy="${y}" rx="8.5" ry="6" transform="rotate(-20 ${x} ${y})" fill="#1d2433"/><line x1="${x+(i>=6?-8:8)}" y1="${y}" x2="${x+(i>=6?-8:8)}" y2="${y+(i>=6?36:-36)}" stroke="#1d2433" stroke-width="2"/><text x="10" y="142" font-size="11" fill="#6b7385">Violinschlüssel</text></svg>`}
function barSVG(labs,vals,step){const mx=Math.max(...vals),top=Math.ceil(mx/step)*step+step,H=150,x0=40,y0=170,w=250/labs.length,Y=v=>y0-v/top*H;let s=`<svg viewBox="0 0 300 200" width="300" class="gfx">`;
 for(let v=0;v<=top;v+=step)s+=`<line x1="${x0}" y1="${f1(Y(v))}" x2="290" y2="${f1(Y(v))}" stroke="#e2e6ee"/><text x="${x0-6}" y="${f1(Y(v)+4)}" font-size="11" text-anchor="end" fill="#6b7385">${v}</text>`;
 labs.forEach((l,i)=>{s+=`<rect x="${f1(x0+i*w+w*.18)}" y="${f1(Y(vals[i]))}" width="${f1(w*.64)}" height="${f1(y0-Y(vals[i]))}" fill="#2563eb" rx="3"/><text x="${f1(x0+i*w+w/2)}" y="${y0+15}" font-size="11" text-anchor="middle">${esc(l)}</text>`});
 return s+`<line x1="${x0}" y1="${y0}" x2="290" y2="${y0}" stroke="#1d2433" stroke-width="2"/></svg>`}

th('Mathe',[4,5,6,7],'Diagramme lesen',kl=>{const[ti,labs]=pick([['Lieblingssport der Klasse',['Fußball','Schwimmen','Turnen','Reiten','Tennis']],['Verkaufte Brezen pro Tag',['Mo','Di','Mi','Do','Fr']],['Besucher im Freibad (in Hundert)',['Mai','Jun','Jul','Aug','Sep']]]),step=kl<=4?2:5,vals=labs.map(()=>R(1,8)*step),g=barSVG(labs,vals,step),i=R(0,labs.length-1);
 return pick([

const ORD=(qh,a,p=2,sol='')=>({t:'order',qh,a,opts:shuffle(a),p,sol});
const MAT=(qh,pairs,p=2,sol='')=>({t:'match',qh,left:pairs.map(x=>x[0]),a:pairs.map(x=>x[1]),rights:shuffle([...new Set(pairs.map(x=>x[1]))]),p,sol});

 const bc=e=>/v\. Chr/.test(e[0])?-e[1]:e[1];ev.sort((a,b)=>bc(a)-bc(b));return ORD('Bringe die Ereignisse in die richtige zeitliche Reihenfolge (das früheste zuerst).',ev.map(e=>e[0]),2,ev.map(e=>`${e[0]}: ${e[1]}`).join(' · '))});

 v=[...new Set(v)];if(v.length<4)v=[1,2,3,4];v.sort((a,b)=>a-b);const L=x=>kl>=6?String(x).replace('.',','):fmt(x).replace('-','−');return ORD('Ordne die Zahlen der Größe nach – die kleinste zuerst.',v.map(L),1)});

function givenDisplay(it){const g=String(it.given??'');if(!g.trim())return '';if(it.t==='multi')return g.split(SEP).filter(Boolean).map(esc).join(', ');if(it.t==='order')return g.split(SEP).map(esc).join(' → ');if(it.t==='steps')return g.split(SEP).map(x=>esc(x||'–')).join(' · ');
 if(it.t==='match'){const p=g.split(SEP);return it.left.map((l,i)=>esc(l)+' = '+esc(p[i]||'–')).join('; ')}return esc(g).replace(/\n/g,'<br>')}
function togMulti(i){const it=RUN.items[RUN.idx],o=it.opts[i];let s=String(RUN.ans[RUN.idx]).split(SEP).filter(Boolean);s=s.includes(o)?s.filter(x=>x!==o):[...s,o];RUN.ans[RUN.idx]=s.join(SEP);render()}
function ordAdd(i){const it=RUN.items[RUN.idx],s=RUN.ans[RUN.idx]?String(RUN.ans[RUN.idx]).split(SEP):[];s.push(it.opts[i]);RUN.ans[RUN.idx]=s.join(SEP);render()}
function ordReset(){RUN.ans[RUN.idx]='';render()}
function setMatch(i,v){const it=RUN.items[RUN.idx],s=String(RUN.ans[RUN.idx]||'').split(SEP);while(s.length<it.left.length)s.push('');s[i]=v;RUN.ans[RUN.idx]=s.every(x=>!x)?'':s.join(SEP);const d=document.querySelector(`.dot[data-i="${RUN.idx}"]`);if(d)d.classList.toggle('ans',RUN.ans[RUN.idx]!=='')}
function newInput(it,v,locked,dis){
 if(it.t==='multi'){const sel=String(v).split(SEP).filter(Boolean);return M('Mehrere Antworten können richtig sein.')+it.opts.map((o,i)=>{let c='opt';const s=sel.includes(o);if(locked){if(it.a.includes(o))c+=' right';else if(s)c+=' wrong'}else if(s)c+=' on';return `<button class="${c}" onclick="togMulti(${i})" ${dis}>${s?'☑':'☐'} ${esc(o)}</button>`}).join('')}
 if(it.t==='order'){const sel=String(v)?String(v).split(SEP):[];return `<div class="muted">Tippe die Einträge der Reihe nach an.</div>${sel.length?`<ol class="ordl">${sel.map(o=>`<li>${esc(o)}</li>`).join('')}</ol>`:''}${it.opts.filter(o=>!sel.includes(o)).map(o=>`<button class="opt" onclick="ordAdd(${it.opts.indexOf(o)})" ${dis}>${esc(o)}</button>`).join('')}${sel.length&&!locked?`<button class="btn sec sm" onclick="ordReset()">↺ Neu ordnen</button>`:''}`}
 if(it.t==='match'){const sel=String(v).split(SEP);return it.left.map((l,i)=>`<div class="mrow"><span>${esc(l)}</span><select onchange="setMatch(${i},this.value)" ${dis}><option value="">– wählen –</option>${it.rights.map(r=>`<option${sel[i]===r?' selected':''}>${esc(r)}</option>`).join('')}</select>${locked?(sel[i]===it.a[i]?' ✅':` ❌ <b>${esc(it.a[i])}</b>`):''}</div>`).join('')}
 return null}
const dScore=it=>(+it.p||1)+({num:1,text:1,term:1.5,pair:1.5,frac:1,order:1,match:1,multi:.5,mc:0,tf:-.5}[it.t]||0);
const LVL={auto:'Automatisch (nach Leistung)',leicht:'Leicht',normal:'Normal',schwer:'Schwer'};
function autoLvl(fach){const k=kid();if(!k)return 'normal';const as=S.attempts.filter(a=>a.kidId===k.id&&a.fach===fach).slice(-5);if(as.length<2)return 'normal';const p=as.reduce((s,a)=>s+calc(a).pct,0)/as.length;return p>=85?'schwer':p<60?'leicht':'normal'}
const resolveLvl=()=>SET.lvl&&SET.lvl!=='auto'?SET.lvl:autoLvl(SET.fach);
function buildItems(ids,kl,n,lvl){const ths=T.filter(t=>ids.includes(t.id));if(!ths.length)return[];const want=lvl==='normal'?n:n*3,pool=[],seen=new Set();let i=0,g=0;
 while(pool.length<want&&g<want*40){const t=ths[i%ths.length];i++;g++;const it=t.gen(kl);if(seen.has(qKey(it)))continue;seen.add(qKey(it));it.th=t.name;it.tid=t.id;pool.push(it)}
 let sel=pool.slice(0,n);if(lvl==='leicht')sel=pool.map(x=>[x,dScore(x)+Math.random()*.6]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]);else if(lvl==='schwer')sel=pool.map(x=>[x,dScore(x)+Math.random()*.6]).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);
 sel.sort((a,b)=>ths.findIndex(t=>t.name===a.th)-ths.findIndex(t=>t.name===b.th));return sel}

/* ---------- Lernkartei (Wiederholung nach 1, 3, 7 Tagen) ---------- */
function boxOf(id){S.box=S.box||{};return S.box[id]=S.box[id]||{}}
function seedBox(){if(S.boxSeeded)return;S.boxSeeded=1;S.kids.forEach(k=>{const b=boxOf(k.id);if(Object.keys(b).length)return;wrongPool(k.id).slice(0,40).forEach(x=>{const{_f,_kl,...it}=x;b[qKey(it)]={it,st:0,due:today(),f:_f,kl:_kl}})})}
function updateBox(att){if(!att.kidId)return;const b=boxOf(att.kidId);S.mastered=S.mastered||{};att.items.forEach(it=>{if(it.t==='frei')return;const k=qKey(it),e=b[k];
 if((it.got||0)<+it.p)b[k]={it:stripRun(it),st:0,due:addDays(today(),1),f:e?e.f:att.fach,kl:att.kl};
 else if(e){e.st++;if(e.st>=3){delete b[k];S.mastered[att.kidId]=(S.mastered[att.kidId]||0)+1}else e.due=addDays(today(),[1,3,7][e.st])}})}
function startReview(all){const k=kid();let es=Object.values(boxOf(k.id));if(!all)es=es.filter(e=>e.due<=today());es=shuffle(es).slice(0,15);if(!es.length)return;
 startRun(es.map(e=>reshuffle({...e.it})),{fach:'Wiederholung',kl:k.kl,title:'Wiederholung aus der Lernkartei'},'uebung',0,S.keyId);if(RUN)RUN.review=1}

const BADGES=[['erste','🎉','Los geht’s','Erste Probe geschafft',s=>s.n>=1],['zehn','📚','Fleißig','10 Proben/Übungen',s=>s.n>=10],['fuenfzig','🏅','Übungsprofi','50 Proben/Übungen',s=>s.n>=50],['eins','🌟','Einser!','Eine Note 1',s=>s.ones>=1],['einsen','👑','Einser-Sammler','5-mal Note 1',s=>s.ones>=5],
 ['serie3','🔥','Dranbleiber','3 Tage am Stück geübt',s=>s.best>=3],['serie7','🚀','Wochen-Serie','7 Tage am Stück geübt',s=>s.best>=7],['vielfalt','🎨','Allrounder','4 verschiedene Fächer',s=>s.faecher>=4],['kartei','🧠','Gedächtnis-Ass','10 Kartei-Aufgaben gemeistert',s=>s.mastered>=10],['diktat','✍️','Diktat-Profi','20 Diktat-/Hörwörter richtig',s=>s.diktat>=20],['plan','📅','Gut vorbereitet','3 Lernplan-Tage für eine Probe',s=>s.planDays>=3]];
function kidStats(id){const as=S.attempts.filter(a=>a.kidId===id),days=[...new Set(as.map(a=>dstr(new Date(a.date))))].sort();let best=0,cur=0,prev=null;
 for(const d of days){cur=prev&&dayDiff(prev,d)===1?cur+1:1;best=Math.max(best,cur);prev=d}
 let streak=0;if(days.length&&dayDiff(days[days.length-1],today())<=1){streak=1;for(let i=days.length-1;i>0&&dayDiff(days[i-1],days[i])===1;i--)streak++}
 const earned=as.reduce((s,a)=>s+(a.stars||0),0),spent=(S.redeemed||[]).length?(S.redeemed||[]).filter(r=>r.kidId===id).reduce((s,r)=>s+(+r.cost||0),0):((S.spent||{})[id]||0);
 return{n:as.length,ones:as.filter(a=>a.items.length>=5&&calc(a).note===1).length,faecher:new Set(as.map(a=>a.fach).filter(f=>f!=='Wiederholung')).size,best,streak,
  diktat:as.reduce((s,a)=>s+a.items.filter(it=>it.say&&it.got).length,0),planDays:Math.max(0,...(S.termine||[]).filter(t=>t.kidId===id).map(t=>t.done.length)),mastered:(S.mastered||{})[id]||0,earned,spent,bal:earned-spent}}
const earnedBadges=st=>BADGES.filter(b=>b[4](st)).map(b=>b[0]);
function postAttempt(att){const k=att.kidId,before=k?earnedBadges(kidStats(k)):[],r=calc(att),t0=today();let st=0;
 if(att.items.length>=3){st=r.pct>=90?5:r.pct>=75?4:r.pct>=60?3:r.pct>=40?2:1;if(r.note===1&&att.items.length>=5)st++}
 if(k&&!S.attempts.some(a=>a.kidId===k&&dstr(new Date(a.date))===t0)&&kidStats(k).streak>=2){st+=2;att.streakBonus=1}
 att.stars=st;updateBox(att);
 if(RUN&&RUN.terminId){const t=(S.termine||[]).find(x=>x.id===RUN.terminId);if(t&&!t.done.includes(t0))t.done.push(t0);att.terminId=RUN.terminId}
 if(RUN&&RUN.meta&&RUN.meta.lvl)att.lvl=RUN.meta.lvl;
 return before}
